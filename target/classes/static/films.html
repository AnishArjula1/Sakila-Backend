<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Films Page</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link to the CSS file -->
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" crossorigin href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation Bar -->
    <nav>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="customers.html">Customers</a></li>
            <li><a href="films.html">Films</a></li>
        </ul>
    </nav>

    <header>
        <h1>Film Rental</h1>
    </header>

    <main>
        <section class="search-section">
            <h2>Search Films</h2>
            <form class="search-form">
                <div class="form-group">
                    <label for="searchType">Search Type:</label>
                    <select id="searchType">
                        <option value="title">Title</option>
                        <option value="actor">Actor</option>
                        <option value="genre">Genre</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="search">Search Term:</label>
                    <input type="text" id="search" placeholder="Enter name, actor, or genre">
                </div>
                <button type="button" onclick="searchFilms()" class="btn">Search</button>
            </form>
        </section>

        <section id="search-results" class="results-section">
            <h2>Search Results:</h2>
            <ul id="results-list" class="results-list">
                <!-- Search results will be inserted here dynamically -->
            </ul>
        </section>

        <section class="film-details-section" id="film-details-section">
            <h2>Film Details:</h2>
            <ul id="film-details" class="film-details">
                <!-- Film details will be inserted here dynamically -->
            </ul>
        </section>

        <section class="rental-section" id="rental-section">
            <h2>Rent this Film</h2>
            <form onsubmit="rentFilm(event)" class="rental-form">
                <input type="hidden" id="filmId" value="">
                <div class="form-group">
                    <label for="customerId">Customer ID:</label>
                    <input type="number" id="customerId" placeholder="Enter customer ID" required>
                </div>
                <div class="form-group">
                    <label for="staffId">Staff ID:</label>
                    <input type="number" id="staffId" placeholder="Enter staff ID" required>
                </div>
                <button type="submit" class="btn">Rent Film</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Sakila Movie Store. All rights reserved.</p>
    </footer>

    <script>
        // Ensure that the rental section is hidden initially
        document.getElementById('rental-section').style.display = 'none';

        // Function to search for films
        function searchFilms() {
            const searchQuery = document.getElementById('search').value;
            const searchType = document.getElementById('searchType').value;

            fetch(`/api/films/search?query=${searchQuery}&type=${searchType}`)
                .then(response => response.json())
                .then(data => {
                    const resultsList = document.getElementById('results-list');
                    resultsList.innerHTML = '';
                    data.forEach(film => {
                        const li = document.createElement('li');
                        li.classList.add('results-item');
                        const link = document.createElement('a');
                        link.href = '#';
                        link.textContent = film.title;
                        link.addEventListener('click', () => viewFilmDetails(film.filmId));
                        li.appendChild(link);
                        resultsList.appendChild(li);
                    });
                })
                .catch(error => {
                    console.error('Error fetching films:', error);
                });
        }

        // Function to view film details
        function viewFilmDetails(filmId) {
            fetch(`/api/films/${filmId}/details`)
                .then(response => response.json())
                .then(data => {
                    if (data) {
                        const filmDetailsList = document.getElementById('film-details');
                        filmDetailsList.innerHTML = '';
                        const details = `
                            <li><strong>Title:</strong> ${data.title}</li>
                            <li><strong>Description:</strong> ${data.description}</li>
                            <li><strong>Release Year:</strong> ${data.releaseYear}</li>
                            <li><strong>Actors:</strong> ${data.actors}</li>
                            <li><strong>Genre:</strong> ${data.genres || 'N/A'}</li>
                        `;
                        filmDetailsList.innerHTML = details;
                        document.getElementById('film-details-section').style.display = 'block';
                        document.getElementById('rental-section').style.display = 'block';
                        document.getElementById('filmId').value = filmId;
                        // Scroll to film details
                        document.getElementById('film-details-section').scrollIntoView({ behavior: 'smooth' });
                    } else {
                        alert('Film details not found.');
                    }
                })
                .catch(error => {
                    console.error('Error fetching film details:', error);
                });
        }

        // Function to rent a film
        function rentFilm(event) {
            event.preventDefault();

            const filmId = document.getElementById('filmId').value;
            const customerId = document.getElementById('customerId').value;
            const staffId = document.getElementById('staffId').value;

            fetch('/api/rentals/rent', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    filmId: filmId,
                    customerId: customerId,
                    staffId: staffId,
                    rentalDate: new Date().toISOString()
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.rentalId) {
                    alert(`Film rented successfully! Rental ID: ${data.rentalId}`);
                    // Optionally reset the form or hide the rental section
                    document.getElementById('rental-section').style.display = 'none';
                } else {
                    alert('Failed to rent the film.');
                }
            })
            .catch(error => {
                console.error('Error renting film:', error);
            });
        }
    </script>
</body>
</html>
